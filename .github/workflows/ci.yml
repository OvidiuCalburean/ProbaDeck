name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  check:
    if: github.event_name != 'schedule'
    name: Node ${{ matrix.node }} core
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node: ["22.13", "24"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run project checks
        run: pnpm check:core && pnpm check:showcase && pnpm check:infra

  release-verification:
    if: github.event_name != 'schedule'
    name: Browser and packed consumer
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser and package verification
        run: pnpm test:browser && pnpm test:package

      - name: Enforce Lighthouse budgets for every public page
        run: pnpm test:lighthouse

  nightly-stress:
    if: github.event_name == 'schedule'
    name: Extended generative stress verification
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/setup@v2
        with:
          install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run extended property and state-machine tests
        run: pnpm test:property && pnpm test:stress
        env:
          PROBADECK_PROPERTY_RUNS: 500
          PROBADECK_STRESS_RUNS: 1000
          PROBADECK_STRESS_COMMANDS: 100
